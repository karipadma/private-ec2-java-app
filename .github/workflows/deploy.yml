```yaml
name: Build and Deploy to Private EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: padma-private-ec2-artifacts-975050346434
  EC2_INSTANCE_ID: i-005400bdd6b3e0d39

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn clean package

      - name: Debug OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("issuer:", payload.iss);
            console.log("audience:", payload.aud);
            console.log("subject:", payload.sub);
            console.log("repository:", payload.repository);
            console.log("ref:", payload.ref);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050346434:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Upload JAR to S3
        run: |
          aws s3 cp \
            target/private-ec2-app-1.0.jar \
            s3://$S3_BUCKET/private-ec2-app.jar

      - name: Deploy to private EC2
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://padma-private-ec2-artifacts-975050346434/private-ec2-app.jar /opt/task/app.jar",
              "sudo systemctl daemon-reload",
              "sudo systemctl restart private-ec2-app"
            ]' \
            --region "$AWS_REGION"
```
