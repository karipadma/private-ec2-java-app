name: Build and Deploy to Private EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: padma-private-ec2-artifacts-975050346434
  EC2_INSTANCE_ID: i-005400bdd6b3e0d39

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050346434:role/GitHubActionsDeployRole
          aws-region: us-east-1

      - name: Upload JAR to S3
        run: |
          aws s3 cp \
            target/private-ec2-app-1.0.jar \
            s3://$S3_BUCKET/private-ec2-app.jar

      - name: Deploy to private EC2
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://padma-private-ec2-artifacts-975050346434/private-ec2-app.jar /opt/task/app.jar",
              "sudo systemctl daemon-reload",
              "sudo systemctl restart private-ec2-app"
            ]' \
            --region "$AWS_REGION"
